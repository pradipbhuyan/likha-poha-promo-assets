name: Daily WhatsApp Post

on:
  schedule:
    - cron: "0 5 * * *"    # 10:30 IST
    - cron: "30 11 * * *"  # 17:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post next queued WhatsApp item
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEST_RECIPIENT: ${{ secrets.WHATSAPP_TEST_RECIPIENT }}
        run: python scripts/post_next_whatsapp_post.py

      - name: Commit updated queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/whatsapp_queue.json
          git diff --staged --quiet || git commit -m "Mark next WhatsApp post as posted [skip ci]"
          git push
