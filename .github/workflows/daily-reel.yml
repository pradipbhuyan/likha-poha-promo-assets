name: Daily Reel Poster

on:
  schedule:
    - cron: "30 12 * * *"  # 18:00 IST (6pm) daily; actual posting gated to alternate days below
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if today is a reel day (every alternate day)
        id: reelday
        run: |
          DOY=$(date -u +%j)
          if [ $((10#$DOY % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post next queued reel
        if: steps.reelday.outputs.run == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_next_reel.py

      - name: Commit updated reel queue
        if: steps.reelday.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/reel_queue.json
          git diff --staged --quiet || git commit -m "Mark next reel as posted [skip ci]"
          git push
